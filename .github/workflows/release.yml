name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish homebrew cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cask="$(find dist -type f -name osp-release.rb)"
          mkdir -p homebrew/Casks
          cp "$cask" homebrew/Casks/osp-release.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebrew/Casks/osp-release.rb
          if ! git diff --cached --quiet; then
            git commit -m "Brew cask update for osp-release version v${version}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/openshift-pipelines/osp-release.git" HEAD:main
          fi
